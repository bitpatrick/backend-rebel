spring:

  # Connessione RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # Spring Cloud Stream
  cloud:
    function:
      definition: teacherCreatedEvent

    stream:
      defaultBinder: rabbit
      default.contentType: application/json

      bindings:
        teacherCreatedEvent-in-0:

          # Topic/queue logica
          destination: teacher-events

          # Consumer group
          group: teacher-events-group

          consumer:
            # Abilita il partizionamento lato Spring Cloud Stream
            partitioned: true

            # Indice dell'istanza del consumer
            instance-index: ${INSTANCE_INDEX:0}

            # Numero massimo di tentativi
            maxAttempts: 3

            # Attesa iniziale: 500 ms
            backOffInitialInterval: 500

            # Attesa massima: 1000 ms
            backOffMaxInterval: 1000

            # Moltiplicatore del backoff
            backOffMultiplier: 2.0

    # Configurazione specifica RabbitMQ
    rabbit:
      bindings:
        teacherCreatedEvent-in-0:
          consumer:

            # Crea automaticamente la DLQ
            autoBindDlq: true

            # Pubblica il messaggio fallito nella DLQ
            republishToDlq: true