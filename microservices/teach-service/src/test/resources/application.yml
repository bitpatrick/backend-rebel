spring:
  config:
    import:
      # configuration
      - classpath:configuration/spring-app.yml
      - classpath:configuration/spring-config-disable.yml
      - classpath:configuration/spring-eureka-client-disable.yml
      - classpath:configuration/spring-log.yml
      - classpath:configuration/spring-metrics-disable.yml
      - classpath:configuration/spring-web.yml

      # domain
      - classpath:domain/lessons.yml

      # security
      - classpath:security/jwt.yml

      # db
      - classpath:db/h2-console.yml
      - classpath:db/spring-db-h2.yml