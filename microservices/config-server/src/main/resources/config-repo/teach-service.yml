spring:
  config:
    import:

      # spring cloud circuit breaker
      - classpath:config-repo/cloud/circuit-breaker/spring-circuit-breaker-teach-service.yml
      - classpath:config-repo/cloud/circuit-breaker/spring-time-limiter-teach-service.yml

      # spring cloud stream
      - classpath:config-repo/cloud/stream/spring-cloud-stream-binder.yml
      - classpath:config-repo/cloud/stream/spring-cloud-stream-teach.yml

      # observability
      - classpath:config-repo/observability/logging.yml
      - classpath:config-repo/observability/metrics.yml
      - classpath:config-repo/observability/observations.yml
      - classpath:config-repo/observability/spring-boot-reactive-context-propagation.yml
      - classpath:config-repo/observability/tracing.yml

      # db
      - classpath:config-repo/db/h2-console.yml
      - classpath:config-repo/db/init-sql.yml
      - classpath:config-repo/db/spring-data-jpa.yml
      - classpath:config-repo/db/spring-h2-datasource.yml
      - classpath:config-repo/db/spring-show-sql-messages.yml

      # spring cloud discovery client
      - classpath:config-repo/cloud/discovery/spring-eureka-client.yml

      # domain
      - classpath:config-repo/domain/lessons.yml

      # health
      - classpath:config-repo/health/spring-actuator.yml
      - classpath:config-repo/health/spring-actuator-circuitbreaker-health-enabled.yml

      # log
      - classpath:config-repo/log/spring-log.yml
      - classpath:config-repo/log/spring-log-tracing.yml

      # messaging
      - classpath:config-repo/messaging/spring-rabbitmq.yml

      # observability
      - classpath:config-repo/observability/spring-boot-reactive-context-propagation.yml
      - classpath:config-repo/observability/tracing.yml

      # security
      - classpath:config-repo/security/jwt.yml

      # web
      - classpath:config-repo/web/spring-web.yml
