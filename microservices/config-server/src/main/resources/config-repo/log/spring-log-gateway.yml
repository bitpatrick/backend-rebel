spring:
  cloud:
    gateway:
      httpclient:
        # Gateway → microservizi: log del traffico in uscita
        wiretap: true
      httpserver:
        # Client → Gateway: log del traffico in ingresso
        wiretap: true

logging:
  level:
    # Routing: selezione delle route e applicazione dei filtri
    org.springframework.cloud.gateway: TRACE

    # HTTP server: richieste ricevute dal Gateway
    reactor.netty.http.server: DEBUG

    # HTTP client: chiamate dal Gateway ai microservizi
    reactor.netty.http.client: DEBUG

    # Connessioni e traffico di rete Reactor Netty
    reactor.netty: DEBUG

    # Risoluzione degli indirizzi e bilanciamento del carico
    org.springframework.cloud.loadbalancer: DEBUG
