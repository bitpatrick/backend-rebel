management:

  # ============================================================
  # TRACING
  # ============================================================

  tracing:
    sampling:
      # 1.0 = 100% dei trace
      probability: 1.0

  # ============================================================
  # METRICS → OTLP
  # ============================================================

  otlp:
    metrics:
      export:
        # OTLP Collector
        url: http://otel-collector:4318/v1/metrics

  # ============================================================
  # OBSERVATIONS
  # ============================================================

  observations:
    annotations:
      # Abilita @Observed, @Timed, @Counted
      enabled: true

  # ============================================================
  # OPENTELEMETRY
  # ============================================================

  opentelemetry:

    # ------------------------------------------------------------
    # TRACING → OTLP
    # ------------------------------------------------------------

    tracing:
      export:
        otlp:
          # Trace → Collector
          endpoint: http://otel-collector:4318/v1/traces

    # ------------------------------------------------------------
    # LOGGING → OTLP
    # ------------------------------------------------------------

    logging:
      export:
        otlp:
          # Log → Collector
          endpoint: http://otel-collector:4318/v1/logs