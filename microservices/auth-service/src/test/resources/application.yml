# Application configuration for testing purposes
spring:
  config:
    import:
      # app
      - classpath:config/app/spring-app.yml

      # cloud
      - classpath:config/cloud/spring-circuit-breaker-disable.yml
      - classpath:config/cloud/spring-cloud-stream.yml
      - classpath:config/cloud/spring-config-client-disable.yml
      - classpath:config/cloud/spring-eureka-client-disable.yml

      # domain
      - classpath:config/domain/roles.yml

      # log
      - classpath:config/log/spring-log.yml

      # observability
      - classpath:config/observability/spring-observability-disable.yml

      # security
      - classpath:config/security/jwt.yml

      # web
      - classpath:config/web/spring-web.yml