services:
  # ==========================================================
  # LOKI
  # ==========================================================
  # Backend per i logs.
  #
  # OTel Collector → Loki
  # ==========================================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    ports:
      - "3100:3100"