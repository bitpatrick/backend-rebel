# ============================================================
# RECEIVERS
# ============================================================

receivers:

  otlp:
    protocols:

      # OTLP gRPC
      grpc:
        endpoint: 0.0.0.0:4317

      # OTLP HTTP
      http:
        endpoint: 0.0.0.0:4318


# ============================================================
# PROCESSORS
# ============================================================

processors:

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  batch:
    send_batch_size: 512
    timeout: 5s


# ============================================================
# EXPORTERS
# ============================================================

exporters:

  # ----------------------------------------------------------
  # TRACES → TEMPO
  # ----------------------------------------------------------

  otlp/tempo:
    endpoint: tempo:4317

    tls:
      insecure: true


  # ----------------------------------------------------------
  # METRICS → PROMETHEUS
  # ----------------------------------------------------------

  prometheus:
    endpoint: 0.0.0.0:8889


  # ----------------------------------------------------------
  # LOGS → LOKI
  # ----------------------------------------------------------
  # Loki riceve direttamente OTLP.
  # Porta OTLP HTTP di Loki: 3100
  #
  # Endpoint completo:
  # /otlp
  # ----------------------------------------------------------

  otlphttp/loki:
    endpoint: http://loki:3100/otlp


# ============================================================
# SERVICE
# ============================================================

service:

  pipelines:

    # --------------------------------------------------------
    # TRACES
    # --------------------------------------------------------

    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]


    # --------------------------------------------------------
    # METRICS
    # --------------------------------------------------------

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]


    # --------------------------------------------------------
    # LOGS
    # --------------------------------------------------------

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]