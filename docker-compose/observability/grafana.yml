services:
  # ==========================================================
  # GRAFANA
  # ==========================================================
  #
  # Visualizzazione:
  #
  #   Prometheus → Metrics
  #   Tempo      → Traces
  #   Loki       → Logs
  # ==========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki